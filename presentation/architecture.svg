<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 940" width="1600" height="940" role="img" aria-labelledby="t d">
  <title id="t">TowerOps architecture: model proposes, deterministic code decides</title>
  <desc id="d">Synthetic world state feeds conflict prediction and an advisory proposer. The proposal crosses a trust boundary into the deterministic ControlRoom gate, then approval fixture, acknowledgement fixture, simulated transition, and a hash-chained audit log that the explorer can replay.</desc>
  <defs>
    <style>
      text{font-family:"DejaVu Sans",Helvetica,Arial,sans-serif;fill:#e8eef8}
      .box{fill:#14213a;stroke:#3d5a8c;stroke-width:2;rx:12}
      .gate{fill:#10302e;stroke:#3fb8af;stroke-width:2.5;rx:12}
      .prop{fill:#33280f;stroke:#eec277;stroke-width:2;rx:12;stroke-dasharray:9 6}
      .fix{fill:#1e1a36;stroke:#9a8cf0;stroke-width:2;rx:12}
      .ui{fill:#1a2a1a;stroke:#7fc97f;stroke-width:2;rx:12}
      .h{font-size:22px;font-weight:700}
      .s{font-size:15px;fill:#aebbd3}
      .f{font-size:14px;fill:#74d7cf;font-family:"DejaVu Sans Mono",monospace}
      .lane{font-size:15px;letter-spacing:2px;fill:#7d8fb0}
      .arrow{stroke:#c7d3ea;stroke-width:3;fill:none;marker-end:url(#a)}
      .rej{stroke:#ef7f7f;stroke-width:2.5;fill:none;stroke-dasharray:6 5;marker-end:url(#r)}
      .back{stroke:#7d8fb0;stroke-width:2;fill:none;stroke-dasharray:3 6;marker-end:url(#b)}
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c7d3ea"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ef7f7f"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7d8fb0"/></marker>
  </defs>
  <rect width="1600" height="940" fill="#0b1426"/>
  <text x="40" y="52" class="h" style="font-size:30px">TowerOps — the model proposes, deterministic code decides</text>
  <text x="40" y="82" class="s" style="font-size:17px">SYNTHETIC RESEARCH SIMULATION ONLY · fixture identities, no live feeds, no real clearances, no aviation safety claim</text>

  <!-- lanes -->
  <rect x="30" y="110" width="1540" height="200" rx="16" fill="none" stroke="#2a3c5c" stroke-width="1.5"/>
  <text x="50" y="136" class="lane">PROPOSAL SIDE — NOT TRUSTED TO AUTHORIZE</text>
  <rect x="30" y="330" width="1540" height="330" rx="16" fill="#0e1c33" stroke="#3fb8af" stroke-width="2"/>
  <text x="50" y="356" class="lane" style="fill:#3fb8af">DETERMINISTIC TRUST BOUNDARY — towerops.py (ControlRoom)</text>
  <rect x="30" y="680" width="1540" height="230" rx="16" fill="none" stroke="#2a3c5c" stroke-width="1.5"/>
  <text x="50" y="706" class="lane">REPRODUCE &amp; EXPLORE — scenarios.py · explorer.py · web/</text>

  <!-- proposal lane -->
  <rect class="box" x="60" y="150" width="330" height="135"/>
  <text x="80" y="185" class="h">Synthetic world state</text>
  <text x="80" y="212" class="s">2 fictional aircraft, constant velocity</text>
  <text x="80" y="234" class="s">FIXTURE-A / FIXTURE-B · 10,000 ft</text>
  <text x="80" y="262" class="f">WorldState · Aircraft · world_hash</text>

  <rect class="box" x="470" y="150" width="340" height="135"/>
  <text x="490" y="185" class="h">Conflict prediction</text>
  <text x="490" y="212" class="s">closed-form unsafe-interval solve,</text>
  <text x="490" y="234" class="s">5 nm / 1000 ft / 5 min horizon</text>
  <text x="490" y="262" class="f">SafetyPolicy.state_has_conflict</text>

  <rect class="prop" x="890" y="150" width="320" height="135"/>
  <text x="910" y="185" class="h">Advisory proposer</text>
  <text x="910" y="212" class="s">Demo: deterministic AdvisoryPlanner</text>
  <text x="910" y="234" class="s">Adapter: Strands tool, proposal-only</text>
  <text x="910" y="262" class="f">AdvisoryPlanner · strands_adapter</text>

  <rect class="prop" x="1290" y="150" width="250" height="135"/>
  <text x="1310" y="185" class="h">Advisory</text>
  <text x="1310" y="212" class="s">FIXTURE-B: vy → 2.0 nm/min</text>
  <text x="1310" y="234" class="s">bound to world_hash, 8 s expiry</text>
  <text x="1310" y="262" class="f">Advisory.advisory_hash</text>

  <path class="arrow" d="M390 217H468"/>
  <path class="arrow" d="M810 217H888"/>
  <path class="arrow" d="M1210 217H1288"/>
  <path class="arrow" d="M1415 285V400" />

  <!-- gate lane -->
  <rect class="gate" x="1290" y="400" width="250" height="230"/>
  <text x="1310" y="432" class="h">screen_batch</text>
  <text x="1310" y="460" class="s">fresh ≤ 10 s</text>
  <text x="1310" y="482" class="s">world-hash match</text>
  <text x="1310" y="504" class="s">not expired</text>
  <text x="1310" y="526" class="s">advisory_safe (speed, climb,</text>
  <text x="1310" y="548" class="s">separation after change)</text>
  <text x="1310" y="584" class="f">ControlRoom.screen_batch</text>
  <text x="1310" y="606" class="f">(+ apply, same class)</text>

  <rect class="fix" x="960" y="400" width="250" height="230"/>
  <text x="980" y="432" class="h">Approval fixture</text>
  <text x="980" y="460" class="s">must exist, decision=approve,</text>
  <text x="980" y="482" class="s">exact advisory_hash,</text>
  <text x="980" y="504" class="s">inside issue→expiry window</text>
  <text x="980" y="548" class="s">FIXTURE-CONTROLLER-</text>
  <text x="980" y="570" class="s">NOT-AUTHORITY</text>
  <text x="980" y="606" class="f">human_approval_required</text>

  <rect class="fix" x="630" y="400" width="250" height="230"/>
  <text x="650" y="432" class="h">Acknowledgement</text>
  <text x="650" y="460" class="s">must exist, status=accepted,</text>
  <text x="650" y="482" class="s">same advisory_hash,</text>
  <text x="650" y="504" class="s">not before approval,</text>
  <text x="650" y="526" class="s">not after cutoff</text>
  <text x="650" y="606" class="f">ack_missing · ack_late</text>

  <rect class="gate" x="300" y="400" width="250" height="230"/>
  <text x="320" y="432" class="h">Simulated transition</text>
  <text x="320" y="460" class="s">only after every gate passes</text>
  <text x="320" y="482" class="s">new state: version + 1</text>
  <text x="320" y="504" class="s">conflict true → false</text>
  <text x="320" y="548" class="s">Any refusal: world unchanged,</text>
  <text x="320" y="570" class="s">no actuation event</text>
  <text x="320" y="606" class="f">replace_aircraft</text>

  <rect class="gate" x="60" y="400" width="190" height="230"/>
  <text x="80" y="432" class="h">Audit chain</text>
  <text x="80" y="460" class="s">SHA-256, each event</text>
  <text x="80" y="482" class="s">hashes the previous;</text>
  <text x="80" y="504" class="s">rejections recorded</text>
  <text x="80" y="548" class="f">AuditLog.append</text>
  <text x="80" y="570" class="f">AuditLog.verify</text>

  <path class="arrow" d="M1290 515H1212"/>
  <path class="arrow" d="M960 515H882"/>
  <path class="arrow" d="M630 515H552"/>
  <path class="arrow" d="M300 515H252"/>
  <text x="1395" y="652" text-anchor="end" class="s" style="fill:#ef7f7f">any failed gate → GateRejected(reason) → audit reject event, world unchanged</text>
  <path class="rej" d="M1415 630V660H175V632"/>

  <!-- explore lane -->
  <rect class="ui" x="60" y="730" width="470" height="150"/>
  <text x="80" y="765" class="h">Scenario runner</text>
  <text x="80" y="792" class="s">8 fixed cases: approved + 7 refusals</text>
  <text x="80" y="814" class="s">run_scenario → JSON export</text>
  <text x="80" y="850" class="f">scenarios.py · python explorer.py run</text>

  <rect class="ui" x="590" y="730" width="470" height="150"/>
  <text x="610" y="765" class="h">Replay check</text>
  <text x="610" y="792" class="s">re-executes fixed inputs, compares the</text>
  <text x="610" y="814" class="s">whole export; edits → MISMATCH</text>
  <text x="610" y="850" class="f">replay_result · reproducibility, not authenticity</text>

  <rect class="ui" x="1120" y="730" width="420" height="150"/>
  <text x="1140" y="765" class="h">Local explorer UI</text>
  <text x="1140" y="792" class="s">stdlib HTTP on 127.0.0.1 only,</text>
  <text x="1140" y="814" class="s">same-origin, 256 KiB cap, SVG plots</text>
  <text x="1140" y="850" class="f">explorer.py · web/app.js</text>

  <path class="back" d="M155 630V730"/>
  <path class="arrow" d="M530 805H588"/>
  <path class="arrow" d="M1060 805H1118"/>
</svg>

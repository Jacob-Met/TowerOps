name: TowerOps Airspace Lab
on:
  push:
    branches: [main]
    paths: [towerops.py, advisory_options.py, audit_replay.py, decision_trace.py, scenarios.py, tools/generate_airspace_reference.py, tools/verify_decision_trace.mjs, web/airspace/**, .github/workflows/airspace-demo.yml]
  pull_request:
    paths: [towerops.py, advisory_options.py, audit_replay.py, decision_trace.py, scenarios.py, tools/generate_airspace_reference.py, tools/verify_decision_trace.mjs, web/airspace/**, .github/workflows/airspace-demo.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/airspace/package-lock.json
      - run: python tools/generate_airspace_reference.py --check
      - run: npm ci
        working-directory: web/airspace
      - run: npm test
        working-directory: web/airspace
      - run: npm run build
        working-directory: web/airspace
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: PYTHONPATH=. python tools/verify_browser_python.py
      - run: python tools/capture_airspace.py --chrome ""
      - name: Verify saved decision traces
        run: |
          TOWEROPS_PLAYWRIGHT_JS="$(python -c 'from pathlib import Path; import playwright; print(Path(playwright.__file__).parent / "driver" / "package" / "index.mjs")')"
          node tools/verify_decision_trace.mjs --playwright "$TOWEROPS_PLAYWRIGHT_JS" --output "$RUNNER_TEMP/towerops-decision-trace-browser"
      - name: Verify traffic-edit Undo in the actual browser
        timeout-minutes: 5
        env:
          TOWEROPS_UNDO_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          TOWEROPS_UNDO_OUT="$RUNNER_TEMP/towerops-traffic-undo"
          mkdir -p "$TOWEROPS_UNDO_OUT"
          TOWEROPS_CHROME="$(python -c 'from playwright.sync_api import sync_playwright; p = sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          if [ -n "$TOWEROPS_UNDO_BASE" ]; then
            git fetch --no-tags origin "$TOWEROPS_UNDO_BASE"
            TOWEROPS_UNDO_BASE_PATH="$(git ls-tree "$TOWEROPS_UNDO_BASE" -- web/airspace/src/traffic-undo.ts)"
            if [ -z "$TOWEROPS_UNDO_BASE_PATH" ]; then
              TOWEROPS_UNDO_BEFORE="$TOWEROPS_UNDO_OUT/baseline-source"
              git worktree add --detach "$TOWEROPS_UNDO_BEFORE" "$TOWEROPS_UNDO_BASE"
              cmp web/airspace/package-lock.json "$TOWEROPS_UNDO_BEFORE/web/airspace/package-lock.json"
              ln -s "$GITHUB_WORKSPACE/web/airspace/node_modules" "$TOWEROPS_UNDO_BEFORE/web/airspace/node_modules"
              npm --prefix "$TOWEROPS_UNDO_BEFORE/web/airspace" run build > "$TOWEROPS_UNDO_OUT/baseline-build.log" 2>&1
              cat "$TOWEROPS_UNDO_OUT/baseline-build.log"
              node --experimental-websocket web/airspace/tests/traffic-undo.browser.mjs --root "$TOWEROPS_UNDO_BEFORE" --browser "$TOWEROPS_CHROME" --suite basic --expect-missing-undo --output "$TOWEROPS_UNDO_OUT/baseline"
            fi
          fi
          node --experimental-websocket web/airspace/tests/traffic-undo.browser.mjs --root . --browser "$TOWEROPS_CHROME" --output "$TOWEROPS_UNDO_OUT/candidate"
      - name: Retain traffic-edit Undo browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: towerops-traffic-undo-browser
          path: |
            ${{ runner.temp }}/towerops-traffic-undo/baseline-build.log
            ${{ runner.temp }}/towerops-traffic-undo/baseline/browser-report.json
            ${{ runner.temp }}/towerops-traffic-undo/baseline/*.png
            ${{ runner.temp }}/towerops-traffic-undo/candidate/browser-report.json
            ${{ runner.temp }}/towerops-traffic-undo/candidate/*.png
            ${{ runner.temp }}/towerops-traffic-undo/candidate/trace-*.json
          if-no-files-found: ignore
          retention-days: 7
      - run: |
          mkdir -p site/airspace
          cp -R web/airspace/dist/. site/airspace/
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
